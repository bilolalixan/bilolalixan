<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apelsin</title>
<script>
/* Apply the saved theme before first paint (shared with /bilolalixan). */
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (_) {}
  if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

[data-theme="light"] {
  --bg:     #f2f2f2;
  --ink:    #0a0a0a;
  --card:   #ffffff;
  --shadow: 0 4px 24px rgba(0,0,0,0.10);
  --border: rgba(0,0,0,0.08);
}
[data-theme="dark"] {
  --bg:     #0a0a0a;
  --ink:    #f5f5f5;
  --card:   #141414;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
  --border: rgba(255,255,255,0.08);
}

body {
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ── NAVBAR ── */
.navbar {
  width: 100%;
  display: flex;
  align-items: center;
  padding: 18px 24px;
  border-bottom: 0.5px solid var(--border);
}
.navbar a { display: inline-flex; }
.logo { height: 30px; width: auto; display: block; }
/* The logo file is white; show it black on the light theme. */
[data-theme="light"] .logo { filter: invert(1); }
@media (max-width: 480px) {
  .navbar { padding: 14px 16px; }
  .logo { height: 24px; }
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.contact-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--ink); color: var(--card);
  text-decoration: none;
  border-radius: 100px;
  padding: 0 26px; height: 52px;
  font-size: 15px; font-weight: 500; letter-spacing: 0.02em;
  box-shadow: var(--shadow);
  animation: fadeUp 0.45s ease both;
  transition: opacity 0.15s, transform 0.15s;
}
.contact-btn:hover { opacity: 0.85; }
.contact-btn:active { transform: scale(0.97); }
.contact-btn svg { width: 16px; height: 16px; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="/" aria-label="Apelsin">
    <img class="logo" src="/assets/apelsin-logo.png" alt="Апельсин — маркетинговое агентство">
  </a>
</nav>

<main>
<a class="contact-btn" href="/bilolalixan">
  Contact Bilolalixan
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
</a>
</main>

</body>
</html>
