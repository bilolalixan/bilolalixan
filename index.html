<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0b0b0c;
  --card:    #161618;
  --card2:   #1f1f22;
  --chip:    #26262a;
  --line:    rgba(255,255,255,0.07);
  --line2:   rgba(255,255,255,0.12);
  --ink:     #f2f2f3;
  --ink2:    #a1a1a6;
  --ink3:    #6b6b70;
  --radius:  30px;
  --hover:   #303035;
  --card2-hover: #26262a;
  --fill:    #333338;
  --ring:    #3a3a3f;
  --field:   #232326;
  --prose:   #d6d6d9;
  --ok:      #6fcf97;
  --err:     #eb7a7a;
  --knob-shadow: 0 4px 16px rgba(0,0,0,0.45);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg:      #eeeef0;
  --card:    #ffffff;
  --card2:   #f5f5f6;
  --chip:    #ececee;
  --line:    rgba(0,0,0,0.06);
  --line2:   rgba(0,0,0,0.12);
  --ink:     #0b0b0c;
  --ink2:    #5f5f66;
  --ink3:    #9b9ba1;
  --hover:   #e0e0e3;
  --card2-hover: #ececee;
  --fill:    #e2e2e5;
  --ring:    #d4d4d8;
  --field:   #ffffff;
  --prose:   #2c2c30;
  --ok:      #1f9d55;
  --err:     #d64545;
  --knob-shadow: 0 4px 14px rgba(0,0,0,0.14);
  color-scheme: light;
}
/* White brand images turn black on the light theme. */
[data-theme="light"] .logo,
[data-theme="light"] .home-btn img { filter: invert(1); }

/* Theme toggle: sun in dark (switch to light), moon in light. */
.theme-btn .i-moon { display: none; }
[data-theme="light"] .theme-btn .i-sun { display: none; }
[data-theme="light"] .theme-btn .i-moon { display: block; }


html, body { background: var(--bg); transition: background 0.3s; }
body {
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
/* The hero and the swipe card fill the first screen; more content follows below. */
.screen {
  min-height: calc(100vh - 24px);
  min-height: calc(100dvh - 24px - env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card {
  border-radius: var(--radius);
  border: 0.5px solid var(--line);
  animation: fadeUp 0.5s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── HERO ── */
.hero {
  background: var(--card);
  padding: 20px 20px 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.hero-top {
  display: flex; align-items: center; justify-content: space-between;
}
.logo { height: 22px; width: auto; display: block; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--chip); border: none; color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none;
  transition: background 0.15s, transform 0.15s;
}
.icon-btn:hover { background: var(--hover); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 40px; padding: 0 16px;
  background: var(--chip); border-radius: 100px;
  font-size: 13px; font-weight: 500; color: var(--ink);
  text-decoration: none; white-space: nowrap;
  transition: background 0.15s;
}
.pill:hover { background: var(--hover); }
.pill svg { width: 15px; height: 15px; }
/* Narrow phones: smaller logo, then an icon-only Blog button, so the top row fits. */
/* Narrow phones: slightly smaller logo, then an icon-only Blog button. */
@media (max-width: 370px) {
  .logo { height: 19px; }
}
@media (max-width: 350px) {
  .logo { height: 17px; }
  .top-actions .pill { width: 40px; padding: 0; justify-content: center; }
  .top-actions .pill span { display: none; }
}
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 17px; height: 17px; }

.hero-body { margin-top: auto; padding-top: 40px; }
.eyebrow { font-size: 13px; color: var(--ink2); margin-bottom: 12px; letter-spacing: 0.01em; }
.greet {
  font-size: clamp(34px, 10.5vw, 44px);
  line-height: 1.08;
  font-weight: 400;
  letter-spacing: -0.035em;
  color: var(--ink2);
}
.greet b { font-weight: 600; color: var(--ink); }
.wave { display: inline-block; transform-origin: 70% 70%; animation: wave 2.4s ease-in-out 0.6s 2; }
@keyframes wave {
  0%, 60%, 100% { transform: rotate(0); }
  10%, 30% { transform: rotate(14deg); }
  20%, 40% { transform: rotate(-8deg); }
}
.greet-avatar {
  display: inline-block;
  width: 0.78em; height: 0.78em;
  border-radius: 50%;
  vertical-align: -0.08em;
  object-fit: cover;
  border: 1.5px solid var(--line2);
}

.chips { display: flex; gap: 6px; margin-top: 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 40px; padding: 0 14px;
  background: var(--card2); border: 0.5px solid var(--line);
  border-radius: 100px;
  font-size: 12.5px; color: var(--ink2); white-space: nowrap;
}
.chip b { color: var(--ink); font-weight: 500; }
.chip svg { width: 13px; height: 13px; flex-shrink: 0; }
/* Chip-sized call to action: opens /booking */
.chip-cta {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
  font-weight: 600; text-decoration: none; gap: 7px;
  transition: opacity 0.15s, transform 0.15s;
}
.chip-cta svg { width: 14px; height: 14px; transition: transform 0.2s ease; }
.chip-cta:hover { opacity: 0.88; }
.chip-cta:hover svg { transform: translateX(2px); }
.chip-cta:active { transform: scale(0.96); }
/* Very narrow phones: the ↗ shortcut to /bilolalixan duplicates the swipe card below */
@media (max-width: 370px) {
  .chips .icon-btn { display: none; }
}
.chips .icon-btn { margin-left: auto; flex-shrink: 0; background: var(--card2); border: 0.5px solid var(--line); }

/* ── SWIPE CARD ── */
/* --p (0…1) is how far the knob has travelled; set from JS. */
.swipe {
  --p: 0;
  position: relative;
  background: var(--card2);
  height: 84px;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none; -webkit-user-select: none;
  cursor: grab;
  animation-delay: 0.08s;
  outline: none;
  transition: background 0.2s;
}
.swipe:focus-visible { box-shadow: 0 0 0 2px var(--ink3); }
.swipe.dragging { cursor: grabbing; }

/* Label sits at the bottom layer: it fades and drifts as the trail covers it. */
.swipe-label {
  position: absolute; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 104px 0 22px;
  pointer-events: none;
  opacity: max(0, calc(1 - var(--p) * 2.2));
  transform: translateX(calc(var(--p) * -28px));
}
.swipe-text { font-size: 14.5px; font-weight: 500; color: var(--ink); line-height: 1.3; }
.swipe-text .sub { color: var(--ink3); font-weight: 400; }
.swipe-hint {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px dashed var(--line2);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink2); flex-shrink: 0;
  transition: border-color 0.2s, color 0.2s;
}
.swipe-hint svg { width: 16px; height: 16px; animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-4px); }
}

/* Trail grows from the right edge behind the knob and covers the label. */
.swipe-fill {
  position: absolute; top: 0; bottom: 0; right: 0; z-index: 2;
  width: 84px;
  background: var(--fill);
  border-radius: var(--radius);
  pointer-events: none;
  display: flex; align-items: center;
  overflow: hidden;
  transition: background 0.25s;
}
.fill-text {
  padding-left: 88px;
  font-size: 14.5px; font-weight: 500; white-space: nowrap;
  color: var(--ink2);
  opacity: clamp(0, calc((var(--p) - 0.25) * 3), 1);
  transition: color 0.25s;
}

.knob {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  width: 64px; height: 64px; border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--ring);
  box-shadow: var(--knob-shadow);
  pointer-events: none;
  transition: border-color 0.25s;
}
.knob img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: transform 0.25s ease;
}

/* Past the threshold: trail turns light, text tells the user to let go. */
.swipe.ready .swipe-fill { background: var(--ink); }
.swipe.ready .fill-text  { color: var(--bg); }
.swipe.ready .knob       { border-color: var(--ink); }

/* Hover (mouse only): lift the card slightly and invite the drag. */
@media (hover: hover) {
  .swipe:hover { background: var(--card2-hover); }
  .swipe:hover .knob img { transform: scale(1.08); }
  .swipe:hover .swipe-hint { border-color: var(--ink3); color: var(--ink); }
  .swipe:hover .swipe-hint svg { animation-duration: 0.9s; }
}
.swipe.dragging .knob img { transform: scale(1.08); }

.swipe.snap .knob, .swipe.snap .swipe-fill {
  transition: transform 0.35s cubic-bezier(.2,.8,.2,1), width 0.35s cubic-bezier(.2,.8,.2,1), background 0.25s, border-color 0.25s;
}
.swipe.snap .swipe-label, .swipe.snap .fill-text {
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.2,.8,.2,1), color 0.25s;
}

/* ── LATEST POSTS: swipeable card stack ── */
.blogs { padding: 22px 20px 18px; }
.blogs[hidden] { display: none; }
.blogs-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.blogs-head .eyebrow { margin-bottom: 6px; }
.blogs-title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--ink); }
.blogs-head .pill { flex-shrink: 0; }

.stack { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.s-card {
  position: absolute; left: 0; right: 0; top: 0;
  display: flex; flex-direction: column;
  padding: 20px 20px 18px;
  background: var(--card2); border: 0.5px solid var(--line2); border-radius: 26px;
  text-decoration: none; color: inherit;
  transform-origin: 50% 100%;
  transition: transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.35s ease, box-shadow 0.3s;
  will-change: transform;
}
.s-card.dragging { transition: none; cursor: grabbing; }
.s-card[data-pos="0"] { z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,0.25); cursor: grab; }
.s-card[data-pos="1"] { z-index: 4; transform: translateY(12px) scale(0.95); opacity: 0.7; pointer-events: none; }
.s-card[data-pos="2"] { z-index: 3; transform: translateY(24px) scale(0.9); opacity: 0.4; pointer-events: none; }
.s-card[data-pos="hidden"] { z-index: 1; transform: translateY(24px) scale(0.9); opacity: 0; pointer-events: none; }
.s-card[data-pos="gone"] { z-index: 6; transform: translateX(-115%) rotate(-10deg); opacity: 0; pointer-events: none; }
.s-card .post-meta { font-size: 12.5px; color: var(--ink3); display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.s-card .post-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink3); }
.s-card .post-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 100px; background: var(--chip); color: var(--ink2); font-size: 11.5px; }
.s-card h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.22; color: var(--ink); }
.s-card p { margin-top: 8px; font-size: 14px; line-height: 1.55; color: var(--ink2);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.s-card .s-foot { margin-top: auto; padding-top: 16px; display: flex; align-items: center; justify-content: space-between; }
.s-card .s-read { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
.s-card .s-read img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line2); }
.s-card .s-go { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--bg); }
.s-card .s-go svg { width: 16px; height: 16px; }

.stack-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 38px; }
.stack-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.stack-dots button { width: 7px; height: 7px; padding: 0; border: none; border-radius: 100px; background: var(--line2); cursor: pointer; transition: width 0.25s, background 0.25s; }
.stack-dots button[aria-current="true"] { width: 20px; background: var(--ink); }
.stack-nav .icon-btn { background: var(--card2); border: 0.5px solid var(--line2); }
@media (prefers-reduced-motion: reduce) { .s-card { transition: opacity 0.2s ease; } }

.foot {
  text-align: center; font-size: 11px; color: var(--ink3);
  padding: 10px 0 2px; letter-spacing: 0.02em;
}
</style>
</head>

    <div class="stack" id="stack"></div>
    <div class="stack-nav">
      <button class="icon-btn" id="stackPrev" type="button" data-i18n-aria="prevPost" aria-label="Oldingi maqola">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="stack-dots" id="stackDots"></div>
      <button class="icon-btn" id="stackNext" type="button" data-i18n-aria="nextPost" aria-label="Keyingi maqola">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </section>

  <p class="foot">© Apelsin · apelsin.asia</p>
</div>

<script>
/* ── SWIPE LEFT → /bilolalixan ── */
(function () {
  const TARGET = '/bilolalixan';
  const L = (k) => (window.I18N ? window.I18N.t(k) : ({ keepGoing: 'Davom eting', release: "Qo'yib yuboring", opening: 'Ochilmoqda...' })[k]);
  const swipe    = document.getElementById('swipe');
  const knob     = document.getElementById('knob');
  const fill     = document.getElementById('swipeFill');
  const fillText = document.getElementById('fillText');
  const KNOB_W = 84;         // knob + its right gap; the fill starts this wide
  const THRESHOLD = 0.6;     // share of the track needed to trigger

  let startX = 0, dx = 0, max = 0, dragging = false, moved = false, done = false, ready = false;

  function render(x) {
    const p = max ? x / max : 0;
    knob.style.transform = 'translateX(' + (-x) + 'px)';
    fill.style.width = (KNOB_W + x) + 'px';
    swipe.style.setProperty('--p', p.toFixed(3));
    setReady(p >= THRESHOLD);
  }

  function setReady(on) {
    if (on === ready) return;
    ready = on;
    swipe.classList.toggle('ready', on);
    fillText.textContent = L(on ? 'release' : 'keepGoing');
    if (on && navigator.vibrate) navigator.vibrate(12);
  }

  function go() {
    done = true;
    max = swipe.clientWidth - KNOB_W;
    swipe.classList.add('snap');
    render(max);
    fillText.textContent = L('opening');
    setTimeout(() => { location.href = TARGET; }, 320);
  }

  function reset() {
    swipe.classList.add('snap');
    render(0);
  }

  swipe.addEventListener('pointerdown', (e) => {
    if (done) return;
    dragging = true; moved = false; dx = 0;
    startX = e.clientX;
    max = swipe.clientWidth - KNOB_W;
    swipe.classList.remove('snap');
    swipe.classList.add('dragging');
    swipe.setPointerCapture(e.pointerId);
  });

  swipe.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = Math.min(Math.max(startX - e.clientX, 0), max);
    if (dx > 4) moved = true;
    render(dx);
  });

  function end() {
    if (!dragging) return;
    dragging = false;
    swipe.classList.remove('dragging');
    if (dx >= max * THRESHOLD) go();
    else if (!moved) hint();
    else reset();
  }
  swipe.addEventListener('pointerup', end);
  swipe.addEventListener('pointercancel', end);

  /* A plain tap nudges the knob to show it should be swiped. */
  function hint() {
    swipe.classList.add('snap');
    render(40);
    setTimeout(reset, 280);
  }

  swipe.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!done) go(); }
  });

  /* Coming back via the browser's back button restores the page from cache. */
  window.addEventListener('pageshow', () => {
    done = false;
    swipe.classList.remove('snap');
    render(0);
  });
})();

/* ── SHARE ── */
document.getElementById('shareBtn').addEventListener('click', async () => {
  const data = { title: 'Apelsin', url: location.origin + '/' };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(data.url);
    alert(window.I18N ? window.I18N.t('copied') : 'Havola nusxalandi');
  } catch (_) {}
});
</script>

<script>
/* ── LATEST POSTS: card stack built from /blog ──
   The newest card is on top. Swipe left (or →) to fly it away and reveal the
   next one; swipe right (or ←) to bring the previous back. After the last
   card it starts again. */
(function () {
  const section = document.getElementById('blogs');
  const stack = document.getElementById('stack');
  const dots = document.getElementById('stackDots');
  const MAX = 8;
  let cards = [], cur = 0;

  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  function build(posts) {
    stack.innerHTML = '';
    cards = posts.slice(0, MAX).map((p) => {
      const a = document.createElement('a');
      a.className = 's-card';
      a.href = p.href;
      a.draggable = false;
      a.innerHTML =
        '<div class="post-meta"></div><h3></h3><p></p>' +
        '<div class="s-foot"><span class="s-read"><img src="/assets/bilolalixan.jpg" alt=""><b>Bilol alixan</b></span><span class="s-go">' + ARROW + '</span></div>';
      a.querySelector('.post-meta').append(...p.meta);
      a.querySelector('h3').textContent = p.title;
      a.querySelector('p').textContent = p.excerpt;
      stack.appendChild(a);
      return a;
    });
    dots.innerHTML = cards.map((_, i) => `<button type="button" aria-label="${i + 1}"></button>`).join('');
    dots.querySelectorAll('button').forEach((b, i) => b.addEventListener('click', () => go(i)));
    section.hidden = false;
    if (window.I18N && window.I18N.refresh) window.I18N.refresh();
    layout();
    fitHeight();
  }

  function layout() {
    cards.forEach((c, i) => {
      const d = i - cur;
      c.dataset.pos = d < 0 ? 'gone' : d <= 2 ? String(d) : 'hidden';
      c.style.transform = '';
      c.setAttribute('tabindex', d === 0 ? '0' : '-1');
      c.setAttribute('aria-hidden', d === 0 ? 'false' : 'true');
    });
    dots.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-current', String(i === cur)));
  }

  // Same height for every card so the ones behind peek out below the top card.
  function fitHeight() {
    cards.forEach((c) => { c.style.height = ''; });
    const h = Math.max(...cards.map((c) => c.offsetHeight), 0);
    cards.forEach((c) => { c.style.height = h + 'px'; });
    stack.style.height = h + 'px';
  }

  function go(i) {
    if (!cards.length) return;
    cur = (i + cards.length) % cards.length;
    layout();
  }

  /* Drag the top card */
  let startX = 0, dx = 0, dragging = false, moved = false, top = null;
  stack.addEventListener('pointerdown', (e) => {
    top = e.target.closest('.s-card[data-pos="0"]');
    if (!top) return;
    dragging = true; moved = false; dx = 0; startX = e.clientX;
    top.classList.add('dragging');
    top.setPointerCapture(e.pointerId);
  });
  stack.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    if (Math.abs(dx) > 6) moved = true;
    top.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
  });
  function end() {
    if (!dragging) return;
    dragging = false;
    top.classList.remove('dragging');
    if (dx < -80) go(cur + 1);
    else if (dx > 80) go(cur - 1);
    else top.style.transform = '';
  }
  stack.addEventListener('pointerup', end);
  stack.addEventListener('pointercancel', end);
  // A drag must not open the post; a plain tap should.
  stack.addEventListener('click', (e) => { if (moved) { e.preventDefault(); moved = false; } });

  document.getElementById('stackPrev').addEventListener('click', () => go(cur - 1));
  document.getElementById('stackNext').addEventListener('click', () => go(cur + 1));
  section.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'ArrowLeft') go(cur - 1);
  });
  window.addEventListener('resize', fitHeight);
  document.addEventListener('langchange', () => requestAnimationFrame(fitHeight));

  /* Posts come from the /blog page itself, so new bot posts appear here too. */
  fetch('/blog/')
    .then((r) => (r.ok ? r.text() : Promise.reject()))
    .then((html) => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const posts = [...doc.querySelectorAll('#posts .post-card')].map((a) => ({
        href: a.getAttribute('href'),
        title: (a.querySelector('.post-title') || {}).textContent || '',
        excerpt: (a.querySelector('.post-excerpt') || {}).textContent || '',
        meta: [...(a.querySelector('.post-meta') || document.createElement('div')).childNodes].map((n) => document.importNode(n, true)),
      })).filter((p) => p.href && p.title);
      if (posts.length) build(posts);
    })
    .catch(() => {});
})();
</script>
<script src="/assets/theme.js"></script>
